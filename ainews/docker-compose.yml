version: '3.8'

services:
  # Nginx 反向代理 - 统一入口
  nginx:
    image: nginx:alpine
    container_name: ainews-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/build:/usr/share/nginx/html:ro
    depends_on:
      - ainews-server
      - ainews-client
    restart: unless-stopped
    networks:
      - ainews-network

  # 后端服务
  ainews-server:
    image: node:20-alpine
    container_name: ainews-server
    hostname: ainews-server
    working_dir: /app
    expose:
      - "3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - AYA_NEWS_SKILL_PATH=/opt/aya-news-skill/SKILL.md
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - ./skills/aya-news-skill:/opt/aya-news-skill:ro
      - server_node_modules:/app/node_modules
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ainews-network
    command: sh -c "npm install && node index.js"

  # 前端服务
  ainews-client:
    image: node:20-alpine
    container_name: ainews-client
    hostname: ainews-client
    working_dir: /app
    expose:
      - "3003"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ainews-network
    depends_on:
      - ainews-server
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm install -g serve@14.2.4 && serve build -l 3003"

networks:
  ainews-network:
    driver: bridge
    name: ainews-network

volumes:
  server_node_modules:
  client_node_modules:
