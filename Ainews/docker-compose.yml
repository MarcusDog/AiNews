services:
  # Nginx 反向代理 - 统一入口
  nginx:
    image: nginx:alpine
    container_name: ainews-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - ainews-server
    restart: unless-stopped
    networks:
      - ainews-network

  # 后端服务
  ainews-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ainews-server:local
    container_name: ainews-server
    hostname: ainews-server
    working_dir: /app
    expose:
      - "3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - AYA_NEWS_SKILL_PATH=/opt/aya-news-skill/SKILL.md
      # Signal 的可选 Token、实例、社区与 Bridge 配置统一从 server/.env 透传；未配置时 L2/L3 保持未配置状态。
    env_file:
      - ./server/.env
    volumes:
      - ./server/data:/app/data
      - ./server/logs:/app/logs
      - ./server/cache:/app/cache
      - ./skills/aya-news-skill:/opt/aya-news-skill:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ainews-network

networks:
  ainews-network:
    driver: bridge
    name: ainews-network
